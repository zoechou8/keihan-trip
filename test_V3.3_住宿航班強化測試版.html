ity": "虎航報到、托運行李", "note": ""}, {"time": "之後", "activity": "安檢、出境", "note": ""}, {"time": "約10:00～10:30", "activity": "進候機區，逛免稅店／吃東西", "note": ""}, {"time": "11:30", "activity": "✈️ 虎航飛往桃園", "note": ""}]}}, "transport": [{"date": "2026/11/26", "route": "KIX→神戶", "mode": "高速船 Bay Shuttle"}, {"date": "2026/11/27", "route": "神戶→京都", "mode": "JR新快速"}, {"date": "2026/11/29", "route": "京都→大阪", "mode": "JR新快速"}, {"date": "2026/11/30", "route": "大阪→KIX", "mode": "HARUKA"}], "hotels": [

  ["南京町","神戶南京町"],

  ["清水寺","清水寺 京都"],
  ["八坂神社","八坂神社 京都"],
  ["祇園","祇園 京都"],
  ["伏見稻荷","伏見稻荷大社"],

function doneKey(day,i){return "keihan_done_"+day+"_"+i}
function isDone(day,i){return localStorage.getItem(doneKey(day,i))==="1"}
function toggleDone(day,i){
 localStorage.setItem(doneKey(day,i),isDone(day,i)?"0":"1"); renderTrip();
}
function toggleCard(el){el.classList.toggle("open")}
function renderTrip(){
 const d=DATA.days[currentDay];
 let cards=d.items.map((x,i)=>{
   const done=isDone(currentDay,i);
   return `<article class="card ${done?"doneCard":""}" onclick="toggleCard(this)">
    <div class="row"><div class="time">${esc(x.time)}</div><div class="grow">
      <div class="activity">${esc(x.activity)}</div>
      <div class="detail">${x.note?"💡 "+esc(x.note):"這一筆目前沒有額外備註。"}</div>
      <div class="actions">
       <button class="action doneBtn ${done?"done":""}" onclick="event.stopPropagation();toggleDone('${currentDay}',${i})">${done?"✅ 已完成":"☐ 完成標記"}</button>
       <a class="action" target="_blank" rel="noopener" onclick="event.stopPropagation()" href="${mapUrl(mapQuery(x.activity))}">🗺️ 導航</a>
      </div>
    </div></div></article>`;
 }).join("");
 $("tripPanel").innerHTML=`<div class="hero"><h2>${esc(d.date)}　${esc(d.title)}</h2><div class="muted">共 ${d.items.length} 筆主要行程</div><div class="hint">點行程看說明；「完成標記」會保存在這台裝置的瀏覽器。</div></div>${cards}`;
}
function renderHotels(){
 $("hotelPanel").innerHTML=`<div class="hero"><h2>🏨 住宿資訊</h2><div class="hint">地址、電話可直接使用。訂房編號／確認號不寫進公開 GitHub 原始碼，改存於這台裝置的瀏覽器。</div></div>`+
 DATA.hotels.map((h,i)=>`<div class="box"><div class="muted">${esc(h.date)}｜${esc(h.city)}</div><h2>${esc(h.nameZh||h.name)}</h2>${h.nameZh?`<div class="muted">${esc(h.name)}</div>`:""}
 <div style="line-height:1.8;margin-top:8px"><b>住宿：</b>${esc(h.stay)}<br><b>地址：</b>${esc(h.address)}<br><b>電話：</b>${esc(h.phone)}<br><b>備註：</b>${esc(h.note)}</div>
 <div class="actions">${h.address!=="尚待補充"?`<a class="action" target="_blank" rel="noopener" href="${mapUrl(h.address)}">🗺️ 飯店導航</a>`:""}<a class="action" href="tel:${h.phone.replace(/[^+0-9]/g,"")}">📞 撥打電話</a></div>
 <div style="margin-top:12px;padding:10px;background:#f6f6f8;border-radius:10px"><b>🔐 私人訂房資料（只存本機）</b><div class="hint">可輸入訂房編號／飯店確認號；不會寫進 GitHub。</div><input id="hotelPrivate${i}" placeholder="訂房編號／飯店確認號" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccc;border-radius:8px;margin-top:6px"><button class="action" style="margin-top:6px" onclick="savePrivate('hotel_${i}','hotelPrivate${i}')">儲存私人資料</button><div id="hotelPrivateShow${i}" class="hint"></div></div>
 </div>`).join("");
 renderPrivate();
}
function renderFlights(){
 $("flightPanel").innerHTML=`<div class="hero"><h2>✈️ 航班資訊</h2><div class="hint">去程與回程集中顯示；航空訂單編號採本機私人儲存。</div></div>`+
 DATA.flights.map((f,i)=>`<div class="box"><div class="muted">${esc(f.date)}｜${esc(f.direction)}</div><h2>${esc(f.airline)} ${esc(f.flight)}</h2><div class="route">${esc(f.route)}</div><div style="line-height:1.8"><b>艙等：</b>${esc(f.cabin)}<br><b>起飛：</b>${esc(f.depart)}<br><b>抵達：</b>${esc(f.arrive)}</div>
 <div style="margin-top:12px;padding:10px;background:#f6f6f8;border-radius:10px"><b>🔐 私人訂單編號（只存本機）</b><input id="flightPrivate${i}" placeholder="航空訂單編號" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccc;border-radius:8px;margin-top:6px"><button class="action" style="margin-top:6px" onclick="savePrivate('flight_${i}','flightPrivate${i}')">儲存私人資料</button><div id="flightPrivateShow${i}" class="hint"></div></div>
 </div>`).join("");
 renderPrivate();
}
function renderTransport(){
 $("transportPanel").innerHTML=`<div class="hero"><h2>🚆 主要交通</h2><div class="hint">整理自 Excel「交通移動指南」。</div></div>`+
 DATA.transport.map(t=>`<div class="box"><div class="muted">${esc(t.date)}</div><div class="route">${esc(t.route)}</div><div>${esc(t.mode)}</div><div class="actions"><a class="action" target="_blank" rel="noopener" href="${mapUrl(t.route+" "+t.mode)}">🗺️ 查看地圖</a></div></div>`).join("");
}
function savePrivate(key,inputId){
 const el=$(inputId), val=(el.value||"").trim();
 if(!val){alert("請先輸入資料");return}
 localStorage.setItem("keihan_private_"+key,val);
 el.value="";
 renderPrivate();
}
function renderPrivate(){
 DATA.hotels.forEach((h,i)=>{const el=$("hotelPrivateShow"+i);if(el){const v=localStorage.getItem("keihan_private_hotel_"+i)||"";el.textContent=v?"已儲存："+v:"尚未儲存私人訂房資料";}});
 DATA.flights.forEach((f,i)=>{const el=$("flightPrivateShow"+i);if(el){const v=localStorage.getItem("keihan_private_flight_"+i)||"";el.textContent=v?"已儲存："+v:"尚未儲存私人訂單編號";}});
}
function getExpenses(){try{return JSON.parse(localStorage.getItem("keihan_expenses")||"[]")}catch(e){return []}}
function saveExpenses(x){localStorage.setItem("keihan_expenses",JSON.stringify(x))}
function addExpense(){
 const date=$("expDate").value, cat=$("expCat").value, note=$("expNote").value.trim(), cur=$("expCur").value, amount=parseFloat($("expAmount").value);
 if(!date||!Number.isFinite(amount)||amount<0){alert("請輸入日期與正確金額");return}
 const arr=getExpenses(); arr.unshift({id:Date.now(),date,cat,note,cur,amount}); saveExpenses(arr);
 $("expNote").value=""; $("expAmount").value=""; renderMoney();
}
function delExpense(id){saveExpenses(getExpenses().filter(x=>x.id!==id));renderMoney()}
function renderMoney(){
 const arr=getExpenses(); let jpy=0,twd=0;
 arr.forEach(x=>x.cur==="JPY"?jpy+=x.amount:twd+=x.amount);
 const rows=arr.length?arr.map(x=>`<div class="expense"><div><b>${esc(x.date)}</b><br><span class="muted">${esc(x.cat)}</span></div><div>${esc(x.note||"未填備註")}<br><b>${x.cur==="JPY"?"¥":"NT$"} ${Number(x.amount).toLocaleString()}</b></div><button class="delete" onclick="delExpense(${x.id})">🗑️</button></div>`).join(""):`<div class="muted">目前還沒有記帳資料。</div>`;
 $("moneyPanel").innerHTML=`<div class="hero"><h2>💰 旅行記帳</h2><div class="hint">資料只存在目前這台裝置的瀏覽器，不會上傳 GitHub。清除瀏覽器資料可能會遺失紀錄。</div></div>
 <div class="box"><div class="formgrid">
  <div><label>日期</label><input id="expDate" type="date" value="2026-11-26"></div>
  <div><label>分類</label><select id="expCat"><option>餐飲</option><option>交通</option><option>住宿</option><option>門票</option><option>購物</option><option>其他</option></select></div>
  <div><label>幣別</label><select id="expCur"><option value="JPY">日圓 JPY</option><option value="TWD">台幣 TWD</option></select></div>
  <div><label>金額</label><input id="expAmount" type="number" min="0" step="1" placeholder="例如 1200"></div>
  <div class="full"><label>備註</label><input id="expNote" placeholder="例如：拉麵、HARUKA、伴手禮"></div>
  <div class="full"><button class="primary" onclick="addExpense()">＋ 新增支出</button></div>
 </div></div>
 <div class="box"><h2>支出合計</h2><div class="moneySummary"><div class="money">日圓<br><strong>¥ ${jpy.toLocaleString()}</strong></div><div class="money">台幣<br><strong>NT$ ${twd.toLocaleString()}</strong></div></div>${rows}</div>`;
}
function showPanel(name){
 ["trip","hotel","flight","transport","money"].forEach(n=>$(n+"Panel").classList.toggle("active",n===name));
 document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.panel===name));
 $("datebar").style.display=name==="trip"?"flex":"none";
 const titles={trip:"每日行程",hotel:"住宿",flight:"航班",transport:"交通",money:"旅行記帳"};
 $("pageTitle").textContent=titles[name]; window.scrollTo(0,0);
 if(name==="money")renderMoney();
}
document.querySelectorAll(".datebtn").forEach(b=>b.addEventListener("click",()=>{currentDay=b.dataset.day;document.querySelectorAll(".datebtn").forEach(x=>x.classList.toggle("active",x===b));renderTrip();window.scrollTo(0,0)}));
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>showPanel(b.dataset.panel)));
renderTrip();renderHotels();renderFlights();renderTransport();renderMoney();
</script>
</body></html>
